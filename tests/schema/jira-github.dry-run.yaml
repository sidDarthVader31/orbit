configVersion: 1

workspace:
  root: ~/Documents/codebase
  runs_dir: .orbit/runs
  clone_if_missing: true

tracker:
  provider: jira
  transition_enabled: false
  status_map:
    start: "In Progress"
    local_test: "Local Test"
    pr_review: "PR Review"

docs:
  provider: confluence
  follow_links_from_ticket: true
  max_pages: 3

forge:
  provider: github
  pr:
    draft: true
    labels: []
    title_template: "{{ticket}}: {{summary}}"
    body_template: |
      ## Summary
      {{summary}}
      ## Test plan
      {{test_plan}}

discovery:
  require_ac: false
  require_repos: false
  require_test_strategy: false
  infer_from_title: true
  codebase_fallback: true
  thin_ticket_plan_approval: always

verify:
  mode: runbook_first
  forbid_assume_unit_tests_only: true
  default_profile: unit_local
  profiles:
    unit_local:
      kind: local_commands
      commands: ["make test"]
      agent_may_execute: true
      success_signals: ["tests exit 0"]

efficiency:
  layered_loops: true
  max_redistills: 1
  reuse_distill_if_fresh_hours: 24
  max_doc_pages: 3
  compact_context: true
  lean_context: true
  skip_confluence_if_no_links: true
  stop_on_repeated_tool_error: true

guardrails:
  max_agent_steps: 40
  max_total_tool_calls: 60
  max_verify_retries: 1
  dry_run: true
  disallow_merge: true
  plan_approval: always
