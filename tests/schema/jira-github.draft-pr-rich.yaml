configVersion: 1

workspace:
  root: ~/Documents/codebase
  runs_dir: .orbit/runs
  clone_if_missing: true

tracker:
  provider: jira
  transition_enabled: true
  status_map:
    start: "In Progress"
    local_test: "Local Test"
    pr_review: "PR Review"
    blocked: "Blocked"

docs:
  provider: confluence
  follow_links_from_ticket: true
  max_pages: 8

forge:
  provider: github
  branch_template: "{{ticket}}/{{short-slug}}"
  pr:
    draft: true
    labels: ["needs-review"]
    add_ticket_link: true
    title_template: "{{ticket}}: {{summary}}"
    body_template: |
      ## Jira
      {{ticket_url}}

      ## Summary
      {{summary}}

      ## Changes
      {{changes}}

      ## Test plan
      {{test_plan}}

      ## Screenshots / evidence
      {{screenshots_section}}

discovery:
  require_ac: false
  require_repos: false
  require_test_strategy: false
  ask_user_on_ambiguity: true
  infer_from_title: true
  codebase_fallback: true
  thin_ticket_plan_approval: always

verify:
  mode: runbook_first
  forbid_assume_unit_tests_only: true
  default_profile: wok
  profiles:
    wok:
      description: >
        Example org profile — helm chart brings up full stack on AWS EKS
        in a namespace. Replace names/hints with your org's runbook terms.
      kind: helm
      runbook_hints: ["wok", "helm", "namespace", "local test", "EKS", "kubectl"]
      prerequisites: ["VPN", "kubecontext", "AWS access"]
      agent_may_execute: false
      success_signals: ["pods ready", "smoke checks from runbook"]
    unit_local:
      kind: local_commands
      commands: ["make test", "make lint"]
      agent_may_execute: true
      success_signals: ["tests exit 0", "lint exit 0"]

efficiency:
  layered_loops: true
  max_redistills: 1
  reuse_distill_if_fresh_hours: 24
  max_doc_pages: 8
  compact_context: true
  lean_context: false
  skip_confluence_if_no_links: true
  stop_on_repeated_tool_error: true

guardrails:
  max_agent_steps: 80
  max_total_tool_calls: 120
  max_verify_retries: 3
  dry_run: false
  disallow_merge: true
  plan_approval: on_multi_repo
